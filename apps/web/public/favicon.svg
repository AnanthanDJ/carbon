<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Kept for reference, but removed from usage for transparent background) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <!-- Emerald to Cyan High-Tech Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Faded Line Gradient for Lattice/Grid Accents -->
    <linearGradient id="line-fade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.2" />
    </linearGradient>

    <!-- Dark Terminal Inner Shell Gradient -->
    <linearGradient id="term-shell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Terminal Window Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00FF87" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Rect removed for transparency -->

  <!-- Background Grid & Lattice Accents removed for cleaner look on transparent background -->

  <!-- LOGO ICON GROUP (Hexagonal Carbon Lattice + CLI Prompt) -->
  <g transform="translate(280, 60)" filter="url(#shadow)">
    <!-- Outer Hexagonal Carbon Ring Frame -->
    <polygon points="140,20 235,75 235,185 140,240 45,185 45,75" fill="url(#term-shell)" stroke="#30363D" stroke-width="3" />
    
    <!-- Glowing Hexagon Lattice Edges -->
    <polygon points="140,20 235,75 235,185 140,240 45,185 45,75" fill="none" stroke="url(#accent-grad)" stroke-width="2" stroke-dasharray="120 40 80 40" filter="url(#glow-subtle)" />

    <!-- Atomic Nodes -->
    <circle cx="140" cy="20" r="5" fill="#00FF87" filter="url(#glow-strong)" />
    <circle cx="235" cy="75" r="5" fill="#00E5FF" filter="url(#glow-strong)" />
    <circle cx="235" cy="185" r="5" fill="#00FF87" filter="url(#glow-strong)" />
    <circle cx="140" cy="240" r="5" fill="#00E5FF" filter="url(#glow-strong)" />
    <circle cx="45" cy="185" r="5" fill="#00FF87" filter="url(#glow-strong)" />
    <circle cx="45" cy="75" r="5" fill="#00E5FF" filter="url(#glow-strong)" />

    <!-- Inner Carbon Geometry / Bond Lines -->
    <path d="M 140,20 L 140,70 M 235,75 L 190,100 M 235,185 L 190,160 M 140,240 L 140,190 M 45,185 L 90,160 M 45,75 L 90,100" stroke="url(#line-fade)" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Terminal Inner Window Base -->
    <rect x="70" y="70" width="140" height="120" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="2" />

    <!-- Terminal Header Dots -->
    <circle cx="85" cy="82" r="3" fill="#FF5F56" />
    <circle cx="95" cy="82" r="3" fill="#FFBD2E" />
    <circle cx="105" cy="82" r="3" fill="#27C93F" />

    <!-- CLI Prompt Motif '>_' Centered in Terminal -->
    <path d="M 92,110 L 115,125 L 92,140" fill="none" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-strong)" />
    
    <!-- Glowing Underscore Cursor -->
    <rect x="125" y="143" width="20" height="4" rx="1" fill="#00E5FF" filter="url(#glow-strong)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </rect>

    <!-- dot circle element removed -->
  </g>

  <!-- WORDMARK GROUP ("carbon") removed per request -->

  <!-- Modern Corner Terminal Brackets removed for cleaner look on transparent background -->
</svg>
