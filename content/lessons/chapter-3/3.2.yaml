id: "c3l2"

title: "Create a File"

difficulty: beginner

estimated_minutes: 4

story: >
  A camp is not complete without a journal. Record the beginning of
  your adventure by creating your first file.

mission:
  title: "Create a File"

  description: >
    Create an empty file named diary.txt inside terminal-camp.

  objective:
    concept: creating_files
    command: touch

  validator:
    type: exact_command
    command: "touch terminal-camp/diary.txt"

  hints:
    - "The directory must already exist."
    - "Verify the file using ls terminal-camp."

  common_mistakes:
    - mistake: "Misspelling the directory name"
      explanation: "The path must exist before the file can be created."

    - mistake: "Expecting text inside the file"
      explanation: "touch creates an empty file."

  challenge:
    description: "Create another file named notes.txt."
    example: "touch terminal-camp/notes.txt"

explanation: >
  The touch command creates an empty file if it doesn't exist.
  If the file already exists, it updates its modification timestamp.

example:
  command: "touch terminal-camp/diary.txt"

  output: |
    (No output)

learning_points:
  - "Files store information."
  - "touch creates empty files quickly."
  - "Paths can include directories."

victory_message: >
  Your journal is ready for future adventures.

reward:
  xp: 15

next: "c3l3"
