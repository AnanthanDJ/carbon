id: "c3l6"

title: "Master's Guidance"

difficulty: beginner

estimated_minutes: 5

story: >
  Your training is nearly complete. Before earning the title of
  Terminal Explorer, review the wisdom of the command line one final
  time.

mission:
  title: "Master's Guidance"

  description: >
    Display the built-in help information for the pwd command.

  objective:
    concept: using_command_documentation
    command: help

  validator:
    type: exact_command
    command: "help pwd"

  hints:
    - "Type help followed by the command name."
    - "Read the description before the options."
    - "You don't need to memorize everything."

  common_mistakes:
    - mistake: "Running pwd --help"
      explanation: "Since pwd is a shell built-in, use help pwd."

    - mistake: "Ignoring documentation"
      explanation: "Reading documentation helps you understand commands before using them."

  challenge:
    description: "View the help page for mkdir."
    example: "help mkdir"

explanation: >
  Throughout your journey, you've learned that documentation is one
  of the most valuable tools available. The help command provides
  documentation for shell built-in commands, making it easier to
  understand how they work without leaving the terminal.

example:
  command: "help pwd"

  output: |
    pwd: pwd [-LP]
        Print the name of the current working directory.
    ...

learning_points:
  - "Documentation is an essential Linux skill."
  - "Shell built-ins provide documentation through help."
  - "Reading documentation builds confidence and prevents mistakes."

victory_message: >
  Congratulations! You have completed Terminal Quest.
  You can now navigate the filesystem, create and manage files,
  and confidently use documentation whenever you need guidance.

reward:
  xp: 50

next: "end"
