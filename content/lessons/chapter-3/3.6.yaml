id: 3.6
title: "Master's Guidance"
difficulty: "Beginner"
estimated_time: "5 minutes"

story: >
  Your training is nearly complete. Before earning the title of
  Terminal Explorer, review the wisdom of the command line one final
  time.

mission: >
  Display the help information for the rm command.

objective:
  concept: "Using built-in documentation"
  command: "help"
  syntax: "help rm"

explanation: >
  Throughout your journey, you've learned that documentation is one
  of the most valuable tools available. While rm itself is usually an
  external command (commonly documented with man rm), this lesson
  reinforces the habit of seeking command documentation whenever
  you're unsure how a command behaves.

command: "help rm"

expected_output: |
  If rm is not a shell built-in, your shell may report:
  bash: help: no help topics match 'rm'

hints:
  - "Not every command is a shell built-in."
  - "If help doesn't work, try man rm on a Linux system."

common_mistakes:
  - mistake: "Assuming every command supports help"
    reason: "Only shell built-ins are handled by help."
  - mistake: "Ignoring documentation"
    reason: "Reading documentation prevents mistakes."

challenge:
  description: "Open the manual page for rm (if available)."
  example: "man rm"

learning_points:
  - "Some commands use help, others use man."
  - "Documentation is an essential Linux skill."
  - "Always verify destructive commands before running them."

victory_message: >
  Congratulations! You have completed Terminal Quest.
  You can now navigate the filesystem, create and manage files,
  and confidently use documentation whenever you need guidance.

rewards:
  - "Command reference confidence"
  - "Terminal Explorer Badge 🏆"
  - "Course Complete"
  - "XP +50"
