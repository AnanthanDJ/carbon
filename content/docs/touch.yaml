name: 
      summary: "Creates an empty file."

      purpose: >
        Creates a new empty file at the specified path.

      syntax:
        - "touch <file>"

      parameters:
        - name: "file"
          required: true
          description: >
            The path of the file to create. Supports relative and absolute paths.

      examples:
        - command: "touch notes.txt"
          output: |
            File created.

        - command: "touch /home/projects/main.c"
          output: |
            File created.

      result: >
        A new empty file is created at the specified path.

      notes:
        - "Relative paths are supported."
        - "Absolute paths are supported."
        - "The parent directory must already exist."
        - "Carbon's touch implementation is limited to file creation."

      common_mistakes:
        - mistake: "Attempting to create a file in a nonexistent directory."
          explanation: >
            The parent directory must exist before the file can be created.

        - mistake: "Using touch to update file timestamps."
          explanation: >
            Timestamp updates are not currently supported.

      errors:
        - name: "Parent missing"
          condition: "The parent directory does not exist."

        - name: "File already exists"
          condition: "A file already exists at the specified path."

      limitations:
        - "Timestamp updates are not supported."
        - "Multiple files cannot be created in one command."

      status: "implemented"

      related_commands:
        - "cat"
        - "rm"
        - "ls"
